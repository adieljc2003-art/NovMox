<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="NovMox: tus películas, series y canales en un solo lugar. Hecho para verse en la tele.">
  <title>NovMox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a3a'/%3E%3Cpath d='M14 14 L30 32 L14 50 H24 L35 37.5 L46 50 H52 L36 32 L52 14 H42 L33 24.5 L24 14Z' fill='%233b82f6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo focusable" href="#/inicio" aria-label="NovMox inicio">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 8 L28 32 L8 56 H20 L34 39 L48 56 H58 L38 32 L58 8 H46 L32 25 L18 8Z" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs></svg>
      <span>NovMox</span>
    </a>
    <nav class="tabs" aria-label="Secciones">
      <a class="tab focusable" href="#/inicio" data-ruta="inicio">Inicio</a>
      <a class="tab focusable" href="#/envivo" data-ruta="envivo">TV en vivo</a>
      <a class="tab focusable" href="#/deportes" data-ruta="deportes">Deportes</a>
      <a class="tab focusable" href="#/peliculas" data-ruta="peliculas">Películas</a>
      <a class="tab focusable" href="#/series" data-ruta="series">Series</a>
      <a class="tab focusable" href="#/infantil" data-ruta="infantil">Infantil</a>
    </nav>
    <div class="acciones">
      <a class="icono focusable" href="#/buscar" data-ruta="buscar" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </a>
      <a class="icono focusable" href="#/mis" data-ruta="mis" aria-label="Mi catálogo y ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
      <button class="icono focusable" type="button" id="btn-compartir-app" aria-label="Compartir NovMox">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <span class="wifi" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
      </span>
      <time class="reloj" id="reloj">--:--</time>
    </div>
  </header>

  <aside class="lateral" aria-label="Menú">
    <a class="lat focusable" href="#/inicio" data-ruta="inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span>
    </a>
    <a class="lat focusable" href="#/envivo" data-ruta="envivo">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg><span>En vivo</span>
    </a>
    <a class="lat focusable" href="#/deportes" data-ruta="deportes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5 7 18.5M8 10 3.5 8.5"/></svg><span>Deportes</span>
    </a>
    <a class="lat focusable" href="#/peliculas" data-ruta="peliculas">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.6"/><circle cx="12" cy="16.5" r="1.6"/><circle cx="7.5" cy="12" r="1.6"/><circle cx="16.5" cy="12" r="1.6"/></svg><span>Películas</span>
    </a>
    <a class="lat focusable" href="#/series" data-ruta="series">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="m8 2 4 4 4-4M10 10.5v5l4-2.5z"/></svg><span>Series</span>
    </a>
    <a class="lat focusable" href="#/infantil" data-ruta="infantil">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><circle cx="5" cy="5.5" r="2.5"/><circle cx="19" cy="5.5" r="2.5"/><path d="M9 12h.01M15 12h.01M9.5 16a3.5 3.5 0 0 0 5 0"/></svg><span>Infantil</span>
    </a>
    <a class="lat focusable" href="#/mis" data-ruta="mis">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Agregar</span>
    </a>
  </aside>

  <main id="vista" class="vista" tabindex="-1"></main>

  <!-- Detalle -->
  <div class="capa" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="modal-fondo" id="modal-fondo"></div>
      <div class="modal-cuerpo" id="modal-cuerpo"></div>
    </div>
  </div>

  <!-- Compartir -->
  <div class="capa" id="compartir" hidden>
    <div class="modal modal-chico" role="dialog" aria-modal="true" aria-labelledby="compartir-titulo">
      <div class="modal-cuerpo">
        <h2 id="compartir-titulo">Compartir</h2>
        <p class="tenue" id="compartir-texto"></p>
        <div class="qr" id="qr"></div>
        <input class="campo focusable" id="compartir-link" readonly>
        <div class="botones">
          <button class="btn btn-primario focusable" type="button" id="btn-copiar">Copiar enlace</button>
          <button class="btn focusable" type="button" id="btn-share-nativo" hidden>Enviar…</button>
          <button class="btn focusable" type="button" data-cerrar>Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reproductor -->
  <div class="player" id="player" hidden>
    <div class="player-barra">
      <button class="btn focusable" type="button" id="btn-salir-player">&larr; Volver</button>
      <span id="player-titulo"></span>
    </div>
    <div class="player-zona" id="player-zona"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
